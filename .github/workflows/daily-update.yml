name: Daily repository update

on:
  workflow_dispatch:
  schedule:
    # Every day at 15:17 UTC
    - cron: "17 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repositor
        uses: actions/checkout@v6

      - name: Update timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > LAST_UPDATED

      - name: Commit and push
        run: |
          git config user.name "TobiAkano"
          git config user.email "praisekolawoleakano@gmail.com"
          git add LAST_UPDATED
          git commit -m "chore: update timestamp" || exit 0
          git push
